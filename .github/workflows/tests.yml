name: Java tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [configTest, apiTest, uiTest, dbTest]
    env:
      HEADLESS: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        run: ./gradlew ${{ matrix.suite }} --no-daemon

      - name: Build Allure report
        if: ${{ !cancelled() }}
        run: ./gradlew allureReport --no-daemon

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite }}-reports
          path: |
            build/reports/
            build/test-results/
            build/allure-results/
            build/selenide/
          retention-days: 14
